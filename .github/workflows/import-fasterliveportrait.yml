name: Import FasterLivePortrait upstream

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository with upstream
        shell: bash
        run: |
          set -e
          rm -rf /tmp/FasterLivePortrait
          git clone --depth 1 https://github.com/warmshao/FasterLivePortrait.git /tmp/FasterLivePortrait
          rsync -a --delete --exclude='.git' /tmp/FasterLivePortrait/ ./
          rm -f .github/workflows/import-fasterliveportrait.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import FasterLivePortrait upstream" || exit 0
          git push origin HEAD:main
